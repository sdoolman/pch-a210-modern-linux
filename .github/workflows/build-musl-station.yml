name: Build Musl Utility Station (SSH, Bash, SATA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-musl-suite:
    name: Cross-Compile Musl Utilities & Assemble Rootfs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 xz-utils make gcc g++ flex bison libtool texinfo pkg-config

      - name: Install musl MIPSEL Cross-Compiler
        run: |
          echo "Fetching mipsel-linux-muslsf cross-toolchain..."
          curl --retry 3 --connect-timeout 10 -sSL https://more.musl.cc/10/x86_64-linux-musl/mipsel-linux-muslsf-cross.tgz -o /tmp/toolchain.tgz || \
          curl --retry 3 --connect-timeout 10 -sSL https://musl.cc/mipsel-linux-muslsf-cross.tgz -o /tmp/toolchain.tgz
          sudo tar -xzf /tmp/toolchain.tgz -C /opt
          echo "/opt/mipsel-linux-muslsf-cross/bin" >> $GITHUB_PATH

      - name: Verify Cross-Compiler
        run: |
          /opt/mipsel-linux-muslsf-cross/bin/mipsel-linux-muslsf-gcc --version

      - name: Build Dropbear SSH (from source with musl)
        run: |
          mkdir -p /tmp/build && cd /tmp/build
          curl -sSL https://matt.ucc.asn.au/dropbear/releases/dropbear-2024.85.tar.bz2 | tar -xj
          cd dropbear-2024.85
          ./configure --host=mipsel-linux-muslsf --disable-zlib --enable-static \
            CC=/opt/mipsel-linux-muslsf-cross/bin/mipsel-linux-muslsf-gcc \
            CFLAGS="-Os -static -no-pie" LDFLAGS="-static -no-pie"
          make -j$(nproc) PROGRAMS="dropbear dropbearkey"
          /opt/mipsel-linux-muslsf-cross/bin/mipsel-linux-muslsf-strip -s dropbear dropbearkey
          mkdir -p $GITHUB_WORKSPACE/dist/bin $GITHUB_WORKSPACE/dist/sbin
          cp -f dropbear $GITHUB_WORKSPACE/dist/sbin/dropbear
          cp -f dropbearkey $GITHUB_WORKSPACE/dist/bin/dropbearkey
          file $GITHUB_WORKSPACE/dist/sbin/dropbear

      - name: Build GNU Bash (from source with musl)
        run: |
          cd /tmp/build
          curl -sSL https://ftp.gnu.org/gnu/bash/bash-5.2.tar.gz | tar -xz
          cd bash-5.2
          ./configure --host=mipsel-linux-muslsf --enable-static-link --without-bash-malloc \
            CC=/opt/mipsel-linux-muslsf-cross/bin/mipsel-linux-muslsf-gcc \
            CFLAGS="-Os -static -no-pie" LDFLAGS="-static -no-pie"
          make -j$(nproc)
          /opt/mipsel-linux-muslsf-cross/bin/mipsel-linux-muslsf-strip -s bash
          cp -f bash $GITHUB_WORKSPACE/dist/bin/bash
          file $GITHUB_WORKSPACE/dist/bin/bash
          ls -lh $GITHUB_WORKSPACE/dist/bin/bash

      - name: Build BusyBox (from source with musl)
        run: |
          cd /tmp/build
          curl -sSL https://busybox.net/downloads/busybox-1.36.1.tar.bz2 | tar -xj
          cd busybox-1.36.1
          make defconfig
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          make -j$(nproc) CROSS_COMPILE=/opt/mipsel-linux-muslsf-cross/bin/mipsel-linux-muslsf- \
            CFLAGS="-Os -static -no-pie" LDFLAGS="-static -no-pie"
          /opt/mipsel-linux-muslsf-cross/bin/mipsel-linux-muslsf-strip -s busybox
          cp -f busybox $GITHUB_WORKSPACE/dist/bin/busybox
          file $GITHUB_WORKSPACE/dist/bin/busybox

      - name: Assemble Complete Utility Station Rootfs (initramfs.cpio.gz)
        run: |
          ROOTFS=/tmp/utility_rootfs
          mkdir -p $ROOTFS/{bin,sbin,usr/bin,usr/sbin,etc/dropbear,root,dev,proc,sys,mnt/sata,tmp,var/run}

          # Install binaries
          cp -f $GITHUB_WORKSPACE/dist/bin/bash $ROOTFS/bin/bash
          cp -f $GITHUB_WORKSPACE/dist/sbin/dropbear $ROOTFS/sbin/dropbear
          cp -f $GITHUB_WORKSPACE/dist/bin/dropbearkey $ROOTFS/bin/dropbearkey
          cp -f $GITHUB_WORKSPACE/dist/bin/busybox $ROOTFS/bin/busybox

          # Install busybox symlinks
          cd $ROOTFS/bin && for cmd in $($ROOTFS/bin/busybox --list); do ln -sf busybox $cmd 2>/dev/null || true; done
          cd $ROOTFS && ln -sf bash bin/sh

          # Setup users and authentication
          echo "root::0:0:root:/root:/bin/bash" > $ROOTFS/etc/passwd
          echo "root:::0:99999:7:::" > $ROOTFS/etc/shadow
          echo "root:x:0:" > $ROOTFS/etc/group

          # Setup custom bash prompt and environment
          cat << 'EOF' > $ROOTFS/root/.bashrc
          export PS1='\[\033[01;32m\]root@pch-station\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]# '
          export TERM=xterm-256color
          alias ll='ls -la --color=auto 2>/dev/null || ls -la'
          alias ls='ls --color=auto 2>/dev/null || ls'
          alias df='df -h'
          alias free='free -m'
          EOF

          # Copy and update /init
          cp -f $GITHUB_WORKSPACE/initramfs/init $ROOTFS/init
          chmod +x $ROOTFS/init

          # Create initramfs cpio.gz archive
          cd $ROOTFS
          find . -print0 | cpio --null -ov --format=newc | gzip -9 > $GITHUB_WORKSPACE/dist/initramfs.cpio.gz
          ls -lh $GITHUB_WORKSPACE/dist/

      - name: Upload Utility Station Binaries & Rootfs
        uses: actions/upload-artifact@v4
        with:
          name: pch-a210-utility-station-artifacts
          path: dist/
