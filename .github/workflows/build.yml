name: Popcorn Hour A-210 Bringup CI & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-and-package:
    name: Lint, Audit Safety Gates & Package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MIPS Cross-Disassembler & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu gcc-mipsel-linux-gnu

      - name: Syntax Check All Python Tooling
        run: |
          python -m py_compile scripts/*.py
          echo "All Python automation scripts compiled cleanly."

      - name: Package Bringup Toolkit
        run: |
          mkdir -p dist
          tar -czvf dist/pch-a210-modern-linux.tar.gz kjump/ initramfs/ scripts/ README.md
          ls -lh dist/

      - name: Upload Toolkit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pch-a210-modern-linux-toolkit
          path: dist/pch-a210-modern-linux.tar.gz
